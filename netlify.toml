# Netlify configuration for the NE Insights website (static pages + one function).
# Deploys automatically from GitHub (pv-webservices/ne-insights, branch main).

[build]
  # Production context builds indexable pages; deploy previews are noindex. The audit and unit tests
  # must pass or the deploy is cancelled and the previous version stays live.
  command = "npm run build && npm run audit:built && npm run test:unit"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# Redirects (canonical host, /index.html → folder URLs, retired package URLs) are generated into
# dist/_redirects by scripts/build.mjs. Netlify forces HTTPS and adds trailing slashes itself.

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

# CSS and JS file names contain a content hash, so they can be cached for a year.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Images keep stable URLs (they appear in social cards and image search): 30 days.
[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000, stale-while-revalidate=86400"

[[headers]]
  for = "/site.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json; charset=utf-8"
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/thank-you/*"
  [headers.values]
    X-Robots-Tag = "noindex"

[[headers]]
  for = "/feedback-thank-you/*"
  [headers.values]
    X-Robots-Tag = "noindex"
